
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no">

  <meta name="theme-color" content="#000000">

  <title></title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Arial, sans-serif;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .exit-button {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 30px;
      font-weight: 300;
      cursor: pointer;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="screen">
    <div class="exit-button">×</div>
  </div>

  <audio
  id="sound"
  src="sound.mp3"
  preload="auto"
  playsinline
  loop>
  </audio>

  <script>
    const sound = document.getElementById("sound");

    let started = false;

    function playSound() {
      if (started) return;

      started = true;

      sound.play().catch(() => {
        started = false;
      });
    }

    // Detect taps anywhere on the page
    document.addEventListener("pointerdown", playSound, {
      capture: true,
      passive: true
    });

    // Fallback for older touch browsers
    document.addEventListener("touchstart", playSound, {
      capture: true,
      passive: true
    });

  </script>

</body>
</html>
