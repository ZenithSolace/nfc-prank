<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d35">
  <title>Connection Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background: radial-gradient(circle at top, #294b78 0, #172b49 42%, #0b1425 100%);
    }
    .card {
      width: min(100%, 390px); padding: 34px 26px 26px;
      text-align: center; border-radius: 25px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 22px 65px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
    }
    .signal {
      width: 86px; height: 86px; margin: 0 auto 20px;
      display: grid; place-items: center; border-radius: 24px;
      background: rgba(96,165,250,.16); font-size: 48px;
    }
    .eyebrow { color: #93c5fd; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 27px; }
    p { margin: 0; color: #cbd5e1; font-size: 14px; line-height: 1.65; }
    button {
      width: 100%; margin-top: 26px; padding: 16px 20px;
      border: 0; border-radius: 14px; color: #071426;
      background: linear-gradient(135deg, #93c5fd, #60a5fa);
      font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 24px rgba(59,130,246,.25);
    }
    button:active { transform: scale(.985); }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    #message { min-height: 24px; margin-top: 17px; color: #bfdbfe; font-size: 13px; font-weight: 650; }
    .fineprint { margin-top: 22px; color: #94a3b8; font-size: 11px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="signal" aria-hidden="true">📶</div>
    <div class="eyebrow">Secure network access</div>
    <h1>Connection Portal</h1>
    <p>Your connection is almost ready.<br>Tap below to continue.</p>
    <button id="continueButton" type="button">Continue</button>
    <div id="message" role="status" aria-live="polite"></div>
    <audio id="portalSound" src="sound.mp3" preload="auto"></audio>
    <div class="fineprint">Connection assistant · Please enjoy responsibly</div>
  </main>
  <script>
    const button = document.getElementById("continueButton");
    const audio = document.getElementById("portalSound");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      message.textContent = "";
      audio.currentTime = 0;
      try {
        await audio.play();
        message.textContent = "Surprise! You've been pranked!";
      } catch (error) {
        message.textContent = "Sound not found yet. Add your audio as sound.mp3 to the same folder.";
      }
    });
  </script>
</body>
</html>
