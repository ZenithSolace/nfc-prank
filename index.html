<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player - Loading...</title>
  <style>
    body {
      margin: 0;
      background-color: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      user-select: none;
      cursor: pointer;
    }
    .play-btn {
      width: 70px;
      height: 70px;
      background-color: rgba(255, 0, 0, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }
    .triangle {
      width: 0;
      height: 0;
      border-left: 22px solid white;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      margin-left: 5px;
    }
    p {
      color: #aaaaaa;
      font-size: 14px;
    }
  </style>
</head>
<body onclick="startPrank()">

  <div class="play-btn">
    <div class="triangle"></div>
  </div>
  <h3>Tap anywhere to load video</h3>
  <p>Connection slow. Tap screen to force playback.</p>

  <!-- Replace 'sound.mp3' with your exact audio file name -->
  <audio id="prankAudio" src="sound.mp3" loop preload="auto"></audio>

  <script>
    function startPrank() {
      const audio = document.getElementById('prankAudio');
      audio.volume = 1.0; // Forces 100% browser media volume
      audio.play();
    }
  </script>

</body>
</html>
