
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no">

  <meta name="theme-color" content="#000000">

  <title></title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Arial, sans-serif;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .exit-text {
      position: absolute;
      top: 35px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #777;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: .3px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="screen">
    <div class="exit-text">
      Tap anywhere
    </div>
  </div>

  <audio
    id="sound"
    src="sound.mp3"
    preload="auto"
    playsinline>
  </audio>

  <script>
    const sound = document.getElementById("sound");

    let started = false;

    function playSound() {
      if (started) return;

      started = true;

      sound.play().catch(() => {
        started = false;
      });
    }

    // Listen across the entire page
    document.addEventListener("pointerdown", playSound, {
      capture: true,
      passive: true
    });

    // Fallback for browsers that don't support pointer events
    document.addEventListener("touchstart", playSound, {
      capture: true,
      passive: true
    });

  </script>

</body>
</html>
